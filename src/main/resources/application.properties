spring.application.name=visa-rag-assistant

# Anthropic (for answering questions)
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=claude-sonnet-4-6

# Ollama (for embeddings)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Postgres + pgvector
spring.datasource.url=jdbc:postgresql://localhost:5432/visa_rag
spring.datasource.username=shanks
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768